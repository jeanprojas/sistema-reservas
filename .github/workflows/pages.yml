name: Deploy VIP Norte to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        shell: bash
        run: |
          set -e
          rm -rf _site
          mkdir -p _site/soho _site/salvaje _site/220-voltios _site/reservas-soho _site/reservas-salvaje _site/reservas-220-voltios
          cp -R public/. _site/
          for d in soho salvaje 220-voltios reservas-soho reservas-salvaje reservas-220-voltios; do
            cp public/index.html "_site/$d/index.html"
            cp public/api-bridge.js "_site/$d/api-bridge.js"
          done
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
