name: Run Sheets sync tuning
on: push
permissions:
  contents: write
jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/tune_sync.py
      - run: node --check server.js
      - run: |
          rm -f .github/tune_sync.py .github/workflows/run-tune-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js .github/tune_sync.py .github/workflows/run-tune-sync.yml
          git commit -m 'Tune Sheets sync throughput [sync-tune-done]'
          git push origin HEAD:main
