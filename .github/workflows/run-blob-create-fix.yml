name: Run Blob model compatibility fix
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/fix_blob_create.py
      - run: node --check blob-persistence.js
      - run: |
          rm -f .github/fix_blob_create.py .github/workflows/run-blob-create-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blob-persistence.js .github/fix_blob_create.py .github/workflows/run-blob-create-fix.yml
          git commit -m 'Add Blob model create compatibility [blob-create-done]'
          git push origin HEAD:main
