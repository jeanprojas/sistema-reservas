name: Run sync performance fix
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/apply_sync_fix.py
      - run: node --check server.js && node --check blob-persistence.js
      - run: |
          rm -f .github/apply_sync_fix.py .github/workflows/run-sync-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js blob-persistence.js .github/apply_sync_fix.py .github/workflows/run-sync-fix.yml
          git commit -m 'Fix and accelerate Google Sheets reservation sync [sync-performance-done]'
          git push origin HEAD:main
