name: Apply sync performance fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[sync-performance-done]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Optimize Blob persistence and fix history sync
        shell: python
        run: |
          from pathlib import Path

          # Parallelize Blob reads. The old adapter read every reservation sequentially,
          # making 100+ records take many seconds before synchronization even started.
          path = Path('blob-persistence.js')
          text = path.read_text(encoding='utf-8')
          old = '''    const docs = [];
    for (const blob of blobs) {
        try {
            const doc = await readJson(blob.pathname);
            if (doc) docs.push(doc);
        } catch (error) {
            console.warn(`VIP Norte Blob: no se pudo leer ${blob.pathname}:`, error.message);
        }
    }
    return docs;'''
          new = '''    const docs = new Array(blobs.length);
    let cursor = 0;
    const concurrency = Math.min(20, Math.max(1, blobs.length));
    async function worker() {
        while (true) {
            const index = cursor++;
            if (index >= blobs.length) return;
            const blob = blobs[index];
            try {
                const doc = await readJson(blob.pathname);
                if (doc) docs[index] = doc;
            } catch (error) {
                console.warn(`VIP Norte Blob: no se pudo leer ${blob.pathname}:`, error.message);
            }
        }
    }
    await Promise.all(Array.from({ length: concurrency }, () => worker()));
    return docs.filter(Boolean);'''
          if old not in text:
              raise SystemExit('No se encontró el bloque secuencial de Blob.')
          path.write_text(text.replace(old, new), encoding='utf-8')

          # Fix the history endpoint: BlobModel.find() is thenable but its custom
          # then() intentionally does not return a Promise, so chaining .then()
          # after it produced undefined and therefore synchronized 0 records.
          path = Path('server.js')
          text = path.read_text(encoding='utf-8')
          old = "const reservas = await Reserva.find({}).then(rows => rows.map(row => row.toObject ? row.toObject() : row));"
          new = "const filasReservas = await Reserva.find({});\n        const reservas = filasReservas.map(row => row.toObject ? row.toObject() : row);"
          if old not in text:
              raise SystemExit('No se encontró la línea defectuosa del historial.')
          text = text.replace(old, new, 1)

          # The status endpoint used to scan the entire Blob store three times.
          # Read it once and calculate all counters from the same snapshot.
          start = text.index("app.get('/api/admin/sincronizar-sheets/estado'")
          end = text.index("\n});", start) + len("\n});")
          block = r'''app.get('/api/admin/sincronizar-sheets/estado', async (req, res) => {
    try {
        if (isMemoryMode()) {
            return res.json({
                success: true,
                pendientes: reservasEnColaGoogleMemoria.size,
                total: memoryDb.reservas.length,
                conErrores: [...reservasEnColaGoogleMemoria.values()].filter(item => Number(item.intentos || 0) > 0).length
            });
        }

        const filas = await Reserva.find({});
        const total = filas.length;
        const pendientes = filas.filter(r => r.sheetsSyncPending === true).length;
        const conErrores = filas.filter(r => r.sheetsSyncPending === true && Number(r.sheetsSyncAttempts || 0) > 0).length;
        res.json({ success: true, pendientes, total, conErrores });
    } catch (e) {
        res.status(500).json({ success: false, mensaje: 'No se pudo consultar el estado de sincronización.' });
    }
});'''
          text = text[:start] + block + text[end:]
          path.write_text(text, encoding='utf-8')

      - name: Validate
        run: |
          node --check server.js
          node --check blob-persistence.js

      - name: Commit fix and remove temporary workflow
        run: |
          rm -f .github/workflows/apply-performance-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js blob-persistence.js .github/workflows/apply-performance-fix.yml
          git commit -m 'Optimize reservation sync and Blob reads [sync-performance-done]'
          git push origin HEAD:main
