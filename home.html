<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="VIP NORTE — reservas y experiencias de nightlife en Bello, Antioquia.">
  <title>VIP NORTE DISCOTECAS</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Arial, Helvetica, sans-serif; background: #07080b; color: #fff; }
    .wrap { min-height: 100vh; display: grid; place-items: center; padding: 40px 20px; background: radial-gradient(circle at 50% 20%, #1b1d25 0, #07080b 48%, #030406 100%); }
    .card { width: min(1100px, 100%); text-align: center; padding: 64px 28px; border: 1px solid #242832; border-radius: 28px; background: rgba(10,12,17,.82); box-shadow: 0 25px 80px rgba(0,0,0,.45); }
    .eyebrow { letter-spacing: .22em; font-size: 12px; color: #aeb4c2; text-transform: uppercase; }
    h1 { margin: 14px 0 10px; font-size: clamp(42px, 8vw, 92px); letter-spacing: .04em; line-height: .95; }
    p { color: #b9bfca; font-size: 17px; line-height: 1.6; max-width: 720px; margin: 0 auto 34px; }
    .actions { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
    a { text-decoration: none; padding: 15px 24px; border-radius: 12px; font-weight: 700; }
    .primary { background: #fff; color: #08090b; }
    .secondary { border: 1px solid #3a3f4b; color: #fff; background: #11141a; }
    .venues { margin-top: 48px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .venue { padding: 20px 14px; border: 1px solid #252a34; border-radius: 16px; background: #0d1015; font-weight: 800; letter-spacing: .08em; }
    footer { margin-top: 42px; color: #777f8d; font-size: 12px; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="eyebrow">Bello · Antioquia</div>
      <h1>VIP NORTE</h1>
      <p>El punto de encuentro para nuestras discotecas, reservas y experiencias de nightlife.</p>
      <div class="actions">
        <a class="primary" href="https://app.vipnortediscotecas.com">Hacer una reserva</a>
        <a class="secondary" href="https://wa.me/573014815281">WhatsApp</a>
      </div>
      <div class="venues">
        <div class="venue">SOHO</div>
        <div class="venue">SALVAJE</div>
        <div class="venue">220 VOLTIOS</div>
      </div>
      <footer>VIP NORTE DISCOTECAS · Reservas y atención</footer>
    </section>
  </main>
</body>
</html>
