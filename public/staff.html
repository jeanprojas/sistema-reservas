<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Portal Staff - VIP Norte</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white font-sans p-6">

    <!-- SECCIÓN DE LOGIN DE STAFF -->
    <div id="loginStaffSection" class="flex items-center justify-center h-[80vh]">
        <div class="bg-gray-900 p-8 rounded-2xl shadow-xl max-w-md w-full border border-gray-800 text-center">
            <h1 class="text-2xl font-bold text-orange-500 mb-2">Acceso Operativo Staff</h1>
            <p class="text-gray-400 text-sm mb-6">Ingresa con tus credenciales asignadas</p>
            
            <form onsubmit="realizarLoginStaff(event)" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Usuario:</label>
                    <input type="text" id="staffUser" required class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-orange-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Contraseña:</label>
                    <input type="password" id="staffPass" required class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-orange-500">
                </div>
                <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 font-bold py-3 rounded-lg transition mt-2">Ingresar a Puerta / Pista</button>
            </form>
            <p id="errorLoginStaff" class="text-red-400 text-xs mt-3 hidden"></p>
        </div>
    </div>

    <!-- PANEL PRINCIPAL DE STAFF (Oculto hasta iniciar sesión) -->
    <div id="staffPanel" class="max-w-5xl mx-auto hidden">
        <header class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
            <div>
                <h1 class="text-2xl font-extrabold text-orange-500">Portal Operativo - Staff</h1>
                <p id="infoSedeStaff" class="text-yellow-400 text-sm font-bold mt-1"></p>
            </div>
            <button onclick="cerrarSesionStaff()" class="bg-red-900 hover:bg-red-800 px-3 py-2 rounded-lg text-xs font-bold transition">Cerrar Sesión</button>
        </header>

        <!-- Filtro de Fecha para Staff -->
        <div class="mb-6 bg-gray-900 p-4 rounded-xl border border-gray-800 flex items-center justify-between">
            <div>
                <label class="block text-xs text-gray-400 mb-1">Filtrar por Fecha:</label>
                <input type="date" id="staffFecha" onchange="cargarReservasStaff()" class="bg-gray-950 border border-gray-800 text-white font-medium px-3 py-2 rounded-lg focus:outline-none text-sm">
            </div>
            <div class="text-right">
                <span class="text-xs text-gray-400 block">Sede Restringida:</span>
                <span id="badgeSedeStaff" class="bg-orange-950 text-orange-300 px-3 py-1 rounded-full text-xs font-bold border border-orange-800"></span>
            </div>
        </div>

        <!-- Tabla de Reservas de la Sede -->
        <h2 class="text-lg font-bold mb-4 text-gray-200">Reservas y Accesos de la Sede</h2>
        <div class="bg-gray-900 rounded-xl overflow-hidden border border-gray-800 shadow">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-800 text-xs uppercase text-gray-400">
                        <th class="p-4">Cliente</th>
                        <th class="p-4">Fecha / Zona / Mesa</th>
                        <th class="p-4">Estado Asistencia</th>
                        <th class="p-4 text-center">Acción Puerta</th>
                    </tr>
                </thead>
                <tbody id="tablaStaff" class="divide-y divide-gray-800 text-sm"></tbody>
            </table>
        </div>
    </div>

    <script>
        let sedeActualStaff = '';

        async function realizarLoginStaff(e) {
            e.preventDefault();
            const username = document.getElementById('staffUser').value;
            const password = document.getElementById('staffPass').value;

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            if (data.success) {
                // Permitir acceso tanto a Staff como a Admins si entran por aquí
                localStorage.setItem('vip_staff_auth', 'true');
                localStorage.setItem('vip_staff_user', data.username);
                localStorage.setItem('vip_staff_sede', data.sede);

                iniciarPanelStaff(data.username, data.sede);
            } else {
                const err = document.getElementById('errorLoginStaff');
                err.textContent = data.mensaje;
                err.classList.remove('hidden');
            }
        }

        function iniciarPanelStaff(username, sede) {
            sedeActualStaff = sede;
            document.getElementById('loginStaffSection').classList.add('hidden');
            document.getElementById('staffPanel').classList.remove('hidden');
            document.getElementById('infoSedeStaff').textContent = `Usuario: ${username} | Sede Asignada: ${sede}`;
            document.getElementById('badgeSedeStaff').textContent = sede;

            // Establecer fecha de hoy por defecto
            document.getElementById('staffFecha').value = new Date().toISOString().split('T')[0];
            cargarReservasStaff();
        }

        function cerrarSesionStaff() {
            localStorage.removeItem('vip_staff_auth');
            localStorage.removeItem('vip_staff_user');
            localStorage.removeItem('vip_staff_sede');
            location.reload();
        }

        // Validar si ya hay sesión activa de staff en este navegador
        if (localStorage.getItem('vip_staff_auth') === 'true') {
            iniciarPanelStaff(
                localStorage.getItem('vip_staff_user') || 'Staff',
                localStorage.getItem('vip_staff_sede') || 'Salvaje'
            );
        }

        async function cargarReservasStaff() {
            const fechaSel = document.getElementById('staffFecha').value;
            const res = await fetch('/api/reservas');
            const data = await res.json();

            // Filtrar estrictamente por la sede del usuario (a menos que su sede sea 'TODAS')
            const filtradas = data.filter(r => {
                const sedeReserva = r.sede || 'Salvaje';
                const coincideSede = (sedeActualStaff === 'TODAS' || sedeReserva === sedeActualStaff);
                const coincideFecha = (!fechaSel || r.fecha === fechaSel);
                return coincideSede && coincideFecha;
            });

            const tbody = document.getElementById('tablaStaff');
            tbody.innerHTML = '';

            if (filtradas.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-gray-400">No hay reservas para esta sede en la fecha seleccionada.</td></tr>`;
                return;
            }

            filtradas.forEach(r => {
                let colorEstado = 'bg-yellow-900 text-yellow-300';
                if (r.estadoAsistencia === 'Presente') colorEstado = 'bg-green-900 text-green-300';
                if (r.estadoAsistencia === 'No-Show') colorEstado = 'bg-red-900 text-red-300';
                if (r.estadoAsistencia === 'Prueba') colorEstado = 'bg-purple-900 text-purple-300';

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-850">
                        <td class="p-4 font-medium">${r.nombreCliente}<br><span class="text-xs text-gray-400">${r.telefono}</span></td>
                        <td class="p-4">${r.fecha}<br><span class="text-xs text-gray-400">${r.zona} - Mesa ${r.mesa}</span></td>
                        <td class="p-4">
                            <span class="px-3 py-1 rounded-full text-xs font-semibold ${colorEstado}">
                                ${r.estadoAsistencia}
                            </span>
                        </td>
                        <td class="p-4 text-center space-x-1">
                            <button onclick="cambiarAsistenciaStaff('${r.id}', 'Presente')" class="bg-green-700 hover:bg-green-800 px-3 py-1.5 rounded text-xs font-bold transition">Marcar Presente</button>
                            <button onclick="cambiarAsistenciaStaff('${r.id}', 'No-Show')" class="bg-red-700 hover:bg-red-800 px-3 py-1.5 rounded text-xs font-bold transition">No-Show</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function cambiarAsistenciaStaff(id, nuevoEstado) {
            await fetch(`/api/reservas/${id}/asistencia`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ estadoAsistencia: nuevoEstado })
            });
            cargarReservasStaff();
        }
    </script>
</body>
</html>
