<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Staff & Control en Pista - VIP Norte</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans p-6">
    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-gray-700 pb-4">
            <h1 class="text-2xl font-bold text-orange-500">Control Operativo en Pista</h1>
            <span class="bg-blue-600 px-3 py-1 rounded text-sm">Perfil: Personal de Discoteca</span>
        </header>

        <!-- Validador de QR de Cortesías -->
        <div class="bg-gray-800 p-6 rounded-lg mb-8 shadow-md">
            <h2 class="text-lg font-semibold mb-3 text-yellow-400">Validar Código QR de Cortesía</h2>
            <div class="flex gap-4">
                <input type="text" id="inputQR" placeholder="Ingrese o escanee el código QR..." class="flex-1 bg-gray-900 border border-gray-700 rounded px-4 py-2 text-white">
                <button onclick="validarQR()" class="bg-orange-600 hover:bg-orange-700 px-6 py-2 rounded font-bold transition">Validar</button>
            </div>
            <p id="resultadoQR" class="mt-3 text-sm font-semibold"></p>
        </div>

        <!-- Listado de Reservas en Tiempo Real -->
        <h2 class="text-xl font-bold mb-4">Reservas Activas para la Noche</h2>
        <div class="bg-gray-800 rounded-lg overflow-hidden shadow-md">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-700 text-xs uppercase text-gray-300">
                        <th class="p-3">ID</th>
                        <th class="p-3">Cliente</th>
                        <th class="p-3">Zona / Mesa</th>
                        <th class="p-3">Estado</th>
                        <th class="p-3 text-center">Acción de Asistencia</th>
                    </tr>
                </thead>
                <tbody id="tablaReservas" class="divide-y divide-gray-700 text-sm">
                    <!-- Dinámico -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function cargarReservas() {
            const res = await fetch('/api/reservas');
            const data = await res.json();
            const tbody = document.getElementById('tablaReservas');
            tbody.innerHTML = '';
            
            data.forEach(r => {
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-750">
                        <td class="p-3 font-mono text-xs text-orange-400">${r.id}</td>
                        <td class="p-3">${r.nombreCliente}<br><span class="text-xs text-gray-400">${r.telefono}</span></td>
                        <td class="p-3">${r.zona} - <span class="text-yellow-300">Mesa ${r.mesa}</span></td>
                        <td class="p-3">
                            <span class="px-2 py-1 rounded text-xs ${r.estadoAsistencia === 'Presente' ? 'bg-green-600' : r.estadoAsistencia === 'No-Show' ? 'bg-red-600' : 'bg-yellow-600'}">
                                ${r.estadoAsistencia}
                            </span>
                        </td>
                        <td class="p-3 text-center space-x-2">
                            <button onclick="cambiarEstado('${r.id}', 'Presente')" class="bg-green-700 hover:bg-green-600 px-3 py-1 rounded text-xs">Llegó</button>
                            <button onclick="cambiarEstado('${r.id}', 'No-Show')" class="bg-red-700 hover:bg-red-600 px-3 py-1 rounded text-xs">No Llegó</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function cambiarEstado(id, estado) {
            await fetch(`/api/reservas/${id}/asistencia`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ estadoAsistencia: estado })
            });
            cargarReservas();
        }

        async function validarQR() {
            const codigoQR = document.getElementById('inputQR').value;
            const res = await fetch('/api/validar-qr', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ codigoQR })
            });
            const data = await res.json();
            const p = document.getElementById('resultadoQR');
            p.textContent = data.mensaje;
            p.className = data.valido ? 'mt-3 text-sm font-semibold text-green-400' : 'mt-3 text-sm font-semibold text-red-400';
        }

        cargarReservas();
        setInterval(cargarReservas, 10000); // Actualización en tiempo real cada 10s
    </script>
</body>
</html>
