<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Staff & Control en Pista - VIP Norte</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans p-6">
    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-gray-800 pb-4 gap-4">
            <div>
                <h1 class="text-3xl font-extrabold text-orange-500">Control Operativo en Pista</h1>
                <p class="text-gray-400 text-sm mt-1">Filtra por sede y fecha para gestionar el ingreso.</p>
            </div>
            <!-- Filtros de Sede y Día -->
            <div class="flex flex-wrap items-center gap-3">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Sede:</label>
                    <select id="filtroSede" onchange="cargarReservas()" class="bg-gray-800 border border-gray-700 text-orange-400 font-bold px-3 py-2 rounded-lg focus:outline-none text-sm">
                        <option value="Salvaje">Salvaje</option>
                        <option value="Soho">Soho</option>
                        <option value="220 Voltios">220 Voltios</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Fecha:</label>
                    <input type="date" id="filtroFecha" onchange="cargarReservas()" class="bg-gray-800 border border-gray-700 text-white font-medium px-3 py-2 rounded-lg focus:outline-none text-sm">
                </div>
            </div>
        </header>

        <!-- Validador de QR -->
        <div class="bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700 mb-8">
            <h2 class="text-lg font-semibold text-yellow-400 mb-3">Validar Código QR de Cortesía</h2>
            <div class="flex gap-4">
                <input type="text" id="inputQR" placeholder="Ingrese o escanee el código QR..." class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-orange-500">
                <button onclick="validarQR()" class="bg-orange-600 hover:bg-orange-700 font-bold px-6 py-3 rounded-lg transition">Validar</button>
            </div>
            <div id="resultadoQR" class="mt-3 text-sm"></div>
        </div>

        <!-- Tabla de Reservas -->
        <h2 class="text-xl font-bold mb-4 text-gray-200">Reservas Filtradas</h2>
        <div class="bg-gray-800 rounded-xl overflow-hidden border border-gray-700 shadow-xl">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-700 text-xs uppercase text-gray-300">
                        <th class="p-4">ID</th>
                        <th class="p-4">Cliente</th>
                        <th class="p-4">Fecha / Zona</th>
                        <th class="p-4">Mesa</th>
                        <th class="p-4">Estado</th>
                        <th class="p-4 text-center">Acción de Asistencia</th>
                    </tr>
                </thead>
                <tbody id="tablaReservas" class="divide-y divide-gray-700 text-sm">
                    <!-- Dinámico -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Establecer la fecha de hoy por defecto en el selector
        document.getElementById('filtroFecha').value = new Date().toISOString().split('T')[0];

        async function cargarReservas() {
            const sedeSeleccionada = document.getElementById('filtroSede').value;
            const fechaSeleccionada = document.getElementById('filtroFecha').value;
            
            const res = await fetch('/api/reservas');
            const data = await res.json();
            
            // Filtrar por Sede y por Fecha seleccionada
            const reservasFiltradas = data.filter(r => {
                const coincideSede = (r.sede || 'Salvaje') === sedeSeleccionada;
                const coincideFecha = !fechaSeleccionada || r.fecha === fechaSeleccionada;
                return coincideSede && coincideFecha;
            });
            
            const tbody = document.getElementById('tablaReservas');
            tbody.innerHTML = '';

            if (reservasFiltradas.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-gray-400">No hay reservas para ${sedeSeleccionada} en la fecha ${fechaSeleccionada || 'seleccionada'}.</td></tr>`;
                return;
            }

            reservasFiltradas.forEach(r => {
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-750">
                        <td class="p-4 font-mono text-xs text-orange-400">${r.id}</td>
                        <td class="p-4 font-medium">${r.nombreCliente}<br><span class="text-xs text-gray-400">${r.telefono}</span></td>
                        <td class="p-4">${r.fecha}<br><span class="text-xs text-yellow-400">${r.zona}</span></td>
                        <td class="p-4 font-bold text-orange-300">Mesa ${r.mesa}</td>
                        <td class="p-4">
                            <span class="px-3 py-1 rounded-full text-xs font-semibold ${r.estadoAsistencia === 'Presente' ? 'bg-green-900 text-green-350' : r.estadoAsistencia === 'No-Show' ? 'bg-red-900 text-red-300' : 'bg-yellow-900 text-yellow-300'}">
                                ${r.estadoAsistencia}
                            </span>
                        </td>
                        <td class="p-4 text-center space-x-2">
                            <button onclick="cambiarEstado('${r.id}', 'Presente')" class="bg-green-600 hover:bg-green-700 px-3 py-1.5 rounded text-xs font-bold transition">Llegó</button>
                            <button onclick="cambiarEstado('${r.id}', 'No-Show')" class="bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded text-xs font-bold transition">No Llegó</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function cambiarEstado(id, nuevoEstado) {
            await fetch(`/api/reservas/${id}/asistencia`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ estadoAsistencia: nuevoEstado })
            });
            cargarReservas();
        }

        async function validarQR() {
            const codigo = document.getElementById('inputQR').value;
            const res = await fetch('/api/validar-qr', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ codigoQR: codigo })
            });
            const data = await res.json();
            const div = document.getElementById('resultadoQR');
            if (data.valido) {
                div.innerHTML = `<span class="text-green-400 font-bold">✔ ${data.mensaje}</span>`;
            } else {
                div.innerHTML = `<span class="text-red-400 font-bold">✖ ${data.mensaje}</span>`;
            }
        }

        cargarReservas();
    </script>
</body>
</html>
