<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="tituloPagina">Sistema de Reservas - VIP Norte</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #09090b;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Barra Superior de WhatsApp Dinámica */
        .whatsapp-top-banner {
            background-color: #25d366;
            color: #ffffff;
            text-align: center;
            padding: 10px 15px;
            width: 100%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: background-color 0.3s ease;
        }

        .whatsapp-top-banner:hover {
            background-color: #20ba5a;
        }

        .whatsapp-top-banner a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: inherit;
            gap: 12px;
        }

        .whatsapp-icon {
            width: 28px;
            height: 28px;
            fill: #ffffff;
            flex-shrink: 0;
        }

        .whatsapp-banner-text {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .whatsapp-title {
            font-weight: bold;
            font-size: 15px;
            letter-spacing: 0.3px;
        }

        .whatsapp-subtitle {
            font-size: 12px;
            opacity: 0.9;
        }

        /* Contenedor Principal */
        .main-container {
            max-width: 1150px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 25px;
            flex: 1;
            width: 100%;
        }

        @media (max-width: 950px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: #18181b;
            border: 1px solid #27272a;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card h2 {
            color: #fb923c;
            margin-bottom: 16px;
            font-size: 20px;
            border-bottom: 2px solid #27272a;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #a1a1aa;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            background-color: #27272a;
            border: 1px solid #3f3f46;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #fb923c;
        }

        textarea {
            resize: vertical;
            min-height: 70px;
        }

        .destacado-discoteca {
            border: 2px solid #fb923c !important;
            background-color: #1f1b18 !important;
            color: #ffedd5 !important;
            font-weight: bold;
        }

        .form-grid-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 650px) {
            .form-grid-columns {
                grid-template-columns: 1fr;
            }
        }

        .helper-text {
            font-size: 11px;
            color: #fb923c;
            margin-top: 4px;
            display: block;
        }

        button.btn-primary {
            background-color: #f97316;
            color: white;
            border: none;
            padding: 12px 20px;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button.btn-primary:hover {
            background-color: #ea580c;
        }

        .resultado-consulta {
            margin-top: 15px;
            background-color: #27272a;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-size: 13px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #71717a;
            font-size: 13px;
            border-top: 1px solid #27272a;
        }
    </style>
</head>
<body onload="cargarConfiguracionPagina()">

    <!-- BARRA SUPERIOR WHATSAPP DINÁMICA -->
    <div class="whatsapp-top-banner">
        <a id="whatsappLink" href="https://wa.link/vt0a26" target="_blank" rel="noopener noreferrer">
            <svg class="whatsapp-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
            </svg>
            <div class="whatsapp-banner-text">
                <span id="whatsappTitleText" class="whatsapp-title">Comunícate al número de WhatsApp: 3166995293</span>
                <span id="whatsappSubtitleText" class="whatsapp-subtitle">Para una atención más inmediata.</span>
            </div>
        </a>
    </div>

    <!-- CONTENEDOR DE FORMULARIOS -->
    <div class="main-container">
        
        <!-- COLUMNA IZQUIERDA: CONSULTAR RESERVA -->
        <div class="card">
            <div>
                <h2>Consultar Mi Reserva</h2>
                <div class="form-group">
                    <label for="telefonoConsulta">Número de Teléfono:</label>
                    <input type="text" id="telefonoConsulta" placeholder="Ingresa tu número">
                </div>
            </div>
            <div>
                <button class="btn-primary" onclick="consultarReserva()">Buscar Reserva</button>
                <div id="resultadoConsulta" class="resultado-consulta"></div>
            </div>
        </div>

        <!-- COLUMNA DERECHA: CREAR NUEVA RESERVA -->
        <div class="card">
            <h2>Crear Nueva Reserva</h2>
            <form id="formReserva" onsubmit="crearReserva(event)">
                
                <div class="form-group">
                    <label for="sede" style="color: #fb923c; font-weight: bold;">📍 Seleccionar Discoteca: *</label>
                    <select id="sede" class="destacado-discoteca" required>
                        <option value="" disabled selected>-- Selecciona una discoteca --</option>
                        <option value="Salvaje">Salvaje</option>
                        <option value="Soho">Soho</option>
                        <option value="220 Voltios">220 Voltios</option>
                    </select>
                </div>

                <div class="form-grid-columns">
                    <div>
                        <div class="form-group">
                            <label for="nombreCliente" id="labelNombre">Nombre: *</label>
                            <input type="text" id="nombreCliente" required placeholder="Tu nombre">
                        </div>
                        <div class="form-group">
                            <label for="telefono" id="labelTelefono">Celular/WPP: *</label>
                            <input type="tel" id="telefono" required placeholder="Tu número de WhatsApp">
                        </div>
                        <div class="form-group">
                            <label for="email" id="labelEmail">Correo Electrónico:</label>
                            <input type="email" id="email" placeholder="correo@ejemplo.com">
                        </div>
                        <div class="form-group">
                            <label for="cantidadPersonasInicial" id="labelPersonas">Cantidad de Personas: *</label>
                            <input type="number" id="cantidadPersonasInicial" min="1" value="1" required>
                        </div>
                        <div class="form-group">
                            <label for="fecha" id="labelFecha">Fecha de Visita: *</label>
                            <input type="date" id="fecha" required>
                        </div>
                    </div>

                    <div>
                        <div class="form-group">
                            <label for="motivo" id="labelMotivo">Motivo: *</label>
                            <select id="motivo" required>
                                <option value="" disabled selected>Selecciona un motivo</option>
                                <option value="Cumpleaños">Cumpleaños</option>
                                <option value="Perreo">Perreo</option>
                                <option value="Evento">Evento</option>
                                <option value="Despedida de solter@">Despedida de solter@</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="instagram" id="labelInstagram">Perfil Instagram:</label>
                            <input type="text" id="instagram" placeholder="@tu_instagram">
                        </div>
                        <div class="form-group">
                            <label for="zona" id="labelZona">Zona: *</label>
                            <select id="zona" required onchange="verificarZona(this)">
                                <option value="General">General</option>
                                <option value="VIP">VIP</option>
                                <option value="Palco">Palco</option>
                            </select>
                            <span id="avisoZona" class="helper-text" style="display: none;">* En VIP y Palco hay consumo mínimo.</span>
                        </div>
                        <div class="form-group">
                            <label for="promotor" id="labelPromotor">PROMOTOR (# de Cédula):</label>
                            <input type="text" id="promotor" placeholder="Cédula del promotor (opcional)">
                        </div>
                        <div class="form-group">
                            <label for="nota" id="labelNota">Nota o Comentario:</label>
                            <textarea id="nota" placeholder="Déjanos cualquier detalle adicional..."></textarea>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Confirmar Reserva</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 VIP Norte - Sistema de Gestión y Reservas</p>
    </footer>

   <script>
        // Cargar configuración dinámica desde el servidor al iniciar la página
        async function cargarConfiguracionPagina() {
            try {
                const response = await fetch('/api/configuracion-index');
                if (response.ok) {
                    const data = await response.json();
                    const config = data.config || data;
                    
                    // Ajustar barra superior de WhatsApp dinámicamente si existe configuración
                    if (config.whatsappLink) {
                        document.getElementById('whatsappLink').href = config.whatsappLink;
                    }
                    if (config.whatsappNumero) {
                        document.getElementById('whatsappTitleText').innerText = `Comunícate al número de WhatsApp: ${config.whatsappNumero}`;
                    }
                    if (config.whatsappSubititulo) {
                        document.getElementById('whatsappSubtitleText').innerText = config.whatsappSubititulo;
                    }

                    // Ajustar reglas de campos obligatorios u opcionales según defina el admin
                    if (config.camposConfig) {
                        aplicarReglasCampos(config.camposConfig);
                    }
                }
            } catch (error) {
                console.error("No se pudo cargar la configuración personalizada, usando valores por defecto:", error);
            }
        }

        // Ajustar dinámicamente si los campos son obligatorios u opcionales
        function aplicarReglasCampos(reglas) {
            for (let [campo, configCampo] of Object.entries(reglas)) {
                const elementoInput = document.getElementById(campo);
                const elementoLabel = document.getElementById('label' + campo.charAt(0).toUpperCase() + campo.slice(1));
                
                if (elementoInput) {
                    if (configCampo.requerido) {
                        elementoInput.setAttribute('required', 'required');
                        if (elementoLabel && !elementoLabel.innerText.includes('*')) {
                            elementoLabel.innerText += ' *';
                        }
                    } else {
                        elementoInput.removeAttribute('required');
                        if (elementoLabel) {
                            elementoLabel.innerText = elementoLabel.innerText.replace(' *', '');
                        }
                    }
                }
            }
        }

        function verificarZona(selectObj) {
            const aviso = document.getElementById('avisoZona');
            if (selectObj.value === 'VIP' || selectObj.value === 'Palco') {
                aviso.style.display = 'block';
            } else {
                aviso.style.display = 'none';
            }
        }

        async function consultarReserva() {
            const telefono = document.getElementById('telefonoConsulta').value.trim();
            const contenedorResultado = document.getElementById('resultadoConsulta');

            if (!telefono) {
                alert('Por favor ingresa un número de teléfono.');
                return;
            }

            contenedorResultado.style.display = 'block';
            contenedorResultado.innerHTML = '<p style="color: #a1a1aa;">Buscando reserva...</p>';

            try {
                const respuesta = await fetch('/api/reservas');
                const reservas = await respuesta.json();
                const reservaEncontrada = reservas.find(r => r.telefono && r.telefono.includes(telefono));

                if (reservaEncontrada) {
                    contenedorResultado.innerHTML = `
                        <h3 style="color: #fb923c; margin-bottom: 8px; font-size: 15px;">¡Reserva Encontrada!</h3>
                        <p><b>ID:</b> ${reservaEncontrada.id}</p>
                        <p><b>Cliente:</b> ${reservaEncontrada.nombreCliente}</p>
                        <p><b>Sede:</b> ${reservaEncontrada.sede || 'Salvaje'}</p>
                        <p><b>Fecha:</b> ${reservaEncontrada.fecha}</p>
                        <p><b>Ubicación:</b> ${reservaEncontrada.zona} - Mesa: ${reservaEncontrada.mesa || 'Por Asignar'}</p>
                        <p><b>Personas:</b> ${reservaEncontrada.cantidadPersonasInicial}</p>
                        <p><b>Promotor:</b> ${reservaEncontrada.promotor || 'VIP NORTE'}</p>
                        <p><b>Estado:</b> <span style="color: #34d399; font-weight: bold;">${reservaEncontrada.estadoAsistencia}</span></p>
                        <div style="margin-top: 10px; background-color: #18181b; padding: 8px; border-radius: 6px; text-align: center;">
                            <span style="font-size: 11px; color: #a1a1aa;">PIN / Código de Acceso:</span>
                            <h2 style="color: #fb923c; font-family: monospace; letter-spacing: 2px; margin-top: 2px; font-size: 16px;">${reservaEncontrada.codigoQr || 'N/A'}</h2>
                        </div>
                    `;
                } else {
                    contenedorResultado.innerHTML = `
                        <p style="color: #f87171; text-align: center;">No se encontró ninguna reserva activa asociada al número <b>${telefono}</b>.</p>
                    `;
                }
            } catch (e) {
                console.error(e);
                contenedorResultado.innerHTML = `
                    <p style="color: #f87171; text-align: center;">Error al conectar con el servidor para buscar la reserva.</p>
                `;
            }
        }

        async function crearReserva(event) {
            event.preventDefault();
            
            const sedeValue = document.getElementById('sede').value;
            if (!sedeValue) {
                alert('Por favor selecciona una discoteca.');
                return;
            }

            const fechaSeleccionada = document.getElementById('fecha').value;
            const zonaSeleccionada = document.getElementById('zona').value;
            const personasNuevas = parseInt(document.getElementById('cantidadPersonasInicial').value) || 1;

            try {
                const respuesta = await fetch('/api/reservas');
                const reservas = await respuesta.json();
                const reservasMismoDiaSede = reservas.filter(r => r.fecha === fechaSeleccionada && (r.sede || 'Salvaje') === sedeValue && r.estadoAsistencia !== 'Cancelado');

                const CAPACIDAD_MAXIMA_ZONA = 50;
                const CAPACIDAD_MAXIMA_DISCOTECA = 150;

                const personasEnZona = reservasMismoDiaSede
                    .filter(r => r.zona === zonaSeleccionada)
                    .reduce((acc, r) => acc + (parseInt(r.cantidadPersonasInicial) || 0), 0);

                if (personasEnZona + personasNuevas > CAPACIDAD_MAXIMA_ZONA) {
                    const zonasDisponibles = ['General', 'VIP', 'Palco'].filter(z => z !== zonaSeleccionada);
                    let zonaSugerida = zonasDisponibles[0];
                    
                    for (let z of zonasDisponibles) {
                        const personasEnOtraZona = reservasMismoDiaSede
                            .filter(r => r.zona === z)
                            .reduce((acc, r) => acc + (parseInt(r.cantidadPersonasInicial) || 0), 0);
                        if (personasEnOtraZona + personasNuevas <= CAPACIDAD_MAXIMA_ZONA) {
                            zonaSugerida = z;
                            break;
                        }
                    }

                    alert(`Lo sentimos, la zona "${zonaSeleccionada}" en ${sedeValue} ya tiene el aforo completo o se excede para el ${fechaSeleccionada}. Te sugerimos reservar en la zona "${zonaSugerida}" para ese día.`);
                    return;
                }

                const personasTotalDiscoteca = reservasMismoDiaSede
                    .reduce((acc, r) => acc + (parseInt(r.cantidadPersonasInicial) || 0), 0);

                if (personasTotalDiscoteca + personasNuevas >= CAPACIDAD_MAXIMA_DISCOTECA * 0.9) {
                    const discotecasAlternativas = ['Salvaje', 'Soho', '220 Voltios'].filter(d => d !== sedeValue);
                    alert(`La discoteca ${sedeValue} se encuentra al 90% o más de su aforo para la fecha ${fechaSeleccionada}. Te sugerimos realizar tu reserva en otra de nuestras discotecas: ${discotecasAlternativas.join(' o ')}.`);
                    return;
                }
            } catch (error) {
                console.error("Error al validar aforo:", error);
            }

            const inputPromotor = document.getElementById('promotor').value.trim();
            const promotorFinal = inputPromotor === '' ? 'VIP NORTE' : inputPromotor;

            const payload = {
                nombreCliente: document.getElementById('nombreCliente').value,
                telefono: document.getElementById('telefono').value,
                email: document.getElementById('email').value,
                fecha: fechaSeleccionada,
                sede: sedeValue,
                zona: zonaSeleccionada,
                cantidadPersonasInicial: personasNuevas,
                motivo: document.getElementById('motivo').value,
                instagram: document.getElementById('instagram').value,
                promotor: promotorFinal,
                nota: document.getElementById('nota').value,
                precioCover: 30000,
                estadoAsistencia: 'Reservado',
                usuarioCreador: 'Web Pública'
            };

            try {
                const res = await fetch('/api/admin/reservas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (data.success) {
                    alert('¡Reserva creada con éxito! Se ha registrado correctamente.');
                    document.getElementById('formReserva').reset();
                    document.getElementById('avisoZona').style.display = 'none';
                } else {
                    alert('Hubo un error al registrar tu reserva. Inténtalo de nuevo.');
                }
            } catch (error) {
                console.error(error);
                alert('Error de conexión con el servidor.');
            }
        }
    </script>
</body>
</html>
